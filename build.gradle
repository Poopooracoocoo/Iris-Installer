plugins {
    id 'java'
    id 'application'
}

base {
    archivesName = project.archives_base_name
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

version = project.version
group = project.maven_group

repositories {
    // Fabric's Maven is occasionally only reachable via the mirror hostnames.
    // Keep all three to avoid resolution issues in constrained environments.
    maven {
        url "https://maven.fabricmc.net"
    }
    maven {
        url "https://maven2.fabricmc.net"
    }
    maven {
        url "https://maven3.fabricmc.net"
    }

    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation "org.json:json:20251224"
    implementation "com.formdev:flatlaf:3.7"
    compileOnly "org.lwjgl:lwjgl-tinyfd:3.3.2"
    implementation "net.fabricmc:fabric-installer:1.1.1"
}

application {
    mainClass.set(project.main_class)
}

def localBootstrapRoot = providers.gradleProperty("bootstrapProjectDir")
        .orElse("../fabric-installer-native-bootstrap")

def resourceBootstrap = file(providers.gradleProperty("resourceBootstrap")
        .orElse("${localBootstrapRoot.get()}/x64/Release/fabric-installer-native-bootstrap.exe")
        .get())

def bootstrapPackager = file(providers.gradleProperty("bootstrapPackager")
        .orElse("${localBootstrapRoot.get()}/x64/Release/packager.exe")
        .get())

def nativeExe = tasks.register("nativeExe") {
    def jarTask = tasks.named("jar", Jar)
    dependsOn(jarTask)

    def outputFile = layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}.exe")
    outputs.file(outputFile)
    outputs.upToDateWhen { false }

    doLast {
        if (!resourceBootstrap.isFile()) {
            throw new GradleException("Resource-aware bootstrap not found at ${resourceBootstrap}. Set -PresourceBootstrap=<path> or -PbootstrapProjectDir=<checkout>.")
        }
        if (!bootstrapPackager.isFile()) {
            throw new GradleException("Bootstrap packager not found at ${bootstrapPackager}. Set -PbootstrapPackager=<path> or -PbootstrapProjectDir=<checkout>.")
        }

        def output = outputFile.get().asFile
        def installerJar = jarTask.get().archiveFile.get().asFile
        output.parentFile.mkdirs()

        copy {
            from resourceBootstrap
            into output.parentFile
            rename { output.name }
        }

        def process = new ProcessBuilder(
                bootstrapPackager.absolutePath,
                output.absolutePath,
                installerJar.absolutePath
        ).redirectErrorStream(true).start()

        def processOutput = process.getInputStream().getText('UTF-8')
        def exitCode = process.waitFor()

        if (exitCode != 0) {
            throw new GradleException("Bootstrap packager failed with exit code ${exitCode}:\n${processOutput}")
        }
    }
}

tasks.named("build") {
    dependsOn(nativeExe)
}

tasks.named("jar", Jar) {
    manifest {
        attributes("Main-Class": application.mainClass)
        attributes("Enable-Native-Access": "ALL-UNNAMED")
    }

    duplicatesStrategy = DuplicatesStrategy.WARN
    from "LICENSE"

    from(configurations.runtimeClasspath.filter { it.exists() }.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
}

sourceSets {
    headers {
        java {
            compileClasspath += sourceSets.main.compileClasspath
        }
    }

    main {
        java {
            compileClasspath += sourceSets.headers.output
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"

    def targetVersion = 8
    if (JavaVersion.current().isJava9Compatible()) {
        options.release = targetVersion
    }
}
